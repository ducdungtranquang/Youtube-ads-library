<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1520 356" width="1520" height="356">
  <!-- Nền xanh Zalo -->
  <rect width="1520" height="356" fill="#0664F9" />

  <!-- Cụm nội dung bên trái (Đã được nhóm lại và căn giữa đồng đều trục dọc) -->
  <g transform="translate(410, 170)">
    <!-- Dòng phụ phía trên -->
    <text x="0" y="-75" fill="#FFB86C" font-family="Arial, sans-serif" font-weight="bold" font-size="24" text-anchor="middle">Nâng tầm chuyển đổi, tạm biệt nỗi lo khách ảo</text>
    
    <!-- Tiêu đề chính: Zalo Ads Landing Page -->
    <!-- Dịch sang trái -345px để điểm giữa của toàn bộ dòng chữ nằm đúng trục trung tâm -->
    <g transform="translate(-345, 0)">
      <text x="0" y="0" fill="#FFFFFF" font-family="Arial, sans-serif" font-weight="900" font-size="68">Zalo</text>
      
      <!-- Icon người Zalo -->
      <circle cx="160" cy="-38" r="16" fill="none" stroke="#ffffff" stroke-width="5"/>
      <circle cx="160" cy="-44" r="5" fill="#ffffff"/>
      <path d="M 149 -28 C 149 -38, 171 -38, 171 -28 Z" fill="#ffffff"/>

      <text x="195" y="0" fill="#FFFFFF" font-family="Arial, sans-serif" font-weight="900" font-size="52" letter-spacing="1">ADS LANDING PAGE</text>
    </g>
    
    <!-- Dòng phụ phía dưới -->
    <text x="0" y="55" fill="#FFFFFF" font-family="Arial, sans-serif" font-weight="bold" font-size="24" text-anchor="middle">Ngân sách nhỏ - Lợi nhuận to</text>
  </g>

  <!-- Khối Tag màu cam (Căn giữa theo chiều dọc của banner) -->
  <g transform="translate(840, 118)">
    <path d="M 0 16 C 0 7, 7 0, 16 0 L 225 0 C 234 0, 241 4, 246 11 L 285 60 L 246 109 C 241 116, 234 120, 225 120 L 16 120 C 7 120, 0 113, 0 104 Z" fill="#FE7616" stroke="#FFAE6E" stroke-width="4" />
    <circle cx="255" cy="60" r="12" fill="#0664F9" />
    
    <text x="125" y="52" fill="#FFFFFF" font-family="Arial, sans-serif" font-weight="900" font-size="24" text-anchor="middle">RA ĐƠN NGAY</text>
    <text x="125" y="90" fill="#FFFFFF" font-family="Arial, sans-serif" font-weight="900" font-size="24" text-anchor="middle">CHỈ VỚI 20K</text>
  </g>

  <!-- Danh sách 3 lợi ích bên phải (Canh lề đều tăm tắp) -->
  <g transform="translate(1190, 105)">
    <!-- Ý 1 -->
    <g transform="translate(0, 0)">
      <text x="0" y="24" font-size="26">⚙️</text>
      <text x="45" y="22" fill="#FFFFFF" font-family="Arial, sans-serif" font-weight="bold" font-size="22">Set Camp dễ dàng</text>
    </g>
    
    <!-- Ý 2 -->
    <g transform="translate(0, 65)">
      <text x="0" y="24" font-size="26">💖</text>
      <text x="45" y="22" fill="#FFFFFF" font-family="Arial, sans-serif" font-weight="bold" font-size="22">Tệp khách hàng siêu rộng</text>
    </g>
    
    <!-- Ý 3 (Thay icon bằng dấu tick xám giống bản gốc) -->
    <g transform="translate(0, 130)">
      <circle cx="12" cy="15" r="14" fill="#9CA3AF" />
      <path d="M 6 15 L 10 19 L 18 11" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="45" y="22" fill="#FFFFFF" font-family="Arial, sans-serif" font-weight="bold" font-size="22">Thị trường ít cạnh tranh</text>
    </g>
  </g>
</svg>
